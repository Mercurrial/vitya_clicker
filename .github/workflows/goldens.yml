name: Переснять снимки

# Эталон снимков экрана (test/goldens/) — одна платформа: ubuntu-latest с
# Flutter 3.24.3, та же, на которой их сверяет ci.yml. Раньше снимки снимали
# на разных машинах, и не было ни одной, где проходили бы все: шрифты на
# Windows и на Linux рисуются по-разному. Допуска в сравнении нет намеренно —
# он прятал бы и настоящие сдвиги вёрстки (docs/DECISIONS.md, «Процесс»).
#
# Запуск: Actions → «Переснять снимки» → Run workflow → ветка задачи.
# Из терминала: gh workflow run goldens.yml --ref <ветка>
#
# Переснимаются все снимки, изменившиеся коммитятся в ту же ветку. Потом их
# надо посмотреть глазами в PR — Files changed показывает разницу картинок:
# обновлённый не глядя снимок перестаёт что-либо проверять.
on:
  workflow_dispatch:
  # ВРЕМЕННО, до влития: вручную GitHub запускает только workflow из main.
  push:
    branches: [claude/goldens-ci-ubuntu-8a84b7]

permissions:
  contents: write       # закоммитить снимки в ветку
  actions: write        # одобрить «Проверку PR» на новом коммите

# Два запуска на одну ветку подрались бы за push.
concurrency:
  group: goldens-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Переснять снимки
    runs-on: ubuntu-latest
    steps:
      # main меняется только через PR, тег — это выпуск. Снимкам место в
      # ветке задачи, рядом с правкой, которая их изменила.
      - name: Проверить ветку
        if: github.ref_type != 'branch' || github.ref_name == 'main'
        run: |
          echo "::error::Снимки переснимаются на ветке задачи, а не на main и не на теге. В Run workflow выбери ветку PR."
          exit 1

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Как в ci.yml: снимать надо там же, где сверять.
          flutter-version: 3.24.3
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test --tags golden --run-skipped --update-goldens

      # Упал не снимок, а сам тест: например, блок вылез за экран. Снимок
      # тест делает до проверки на исключения, и переполнение на нём видно
      # жёлто-чёрной полосой. Такое не коммитится, но выкладывается.
      - name: Выложить снимки упавшего прогона
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: goldens-broken
          path: test/goldens/
          retention-days: 14

      - name: Закоммитить снимки
        id: commit
        run: |
          git add test/goldens
          if git diff --cached --quiet; then
            echo "Снимки не изменились — коммитить нечего." >> "$GITHUB_STEP_SUMMARY"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "Изменились снимки:"
            echo
            git diff --cached --name-status | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Переснять снимки экрана" \
            -m "Сняты на ubuntu-latest, Flutter 3.24.3: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Ветка ушла вперёд, пока шёл прогон, — push откажет. Так и надо:
          # снимки сняты со старого кода. Запустить заново.
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Push от GITHUB_TOKEN «Проверку PR» сам не запускает: GitHub заводит
      # её прогон, но ставит ждать одобрения — защита от бесконечных циклов.
      # Без одобрения у коммита со снимками в PR висело бы «ждёт одобрения»
      # вместо зелёной проверки. Запуск ci.yml через workflow_dispatch не
      # годится: такие прогоны PR не показывает (проверено 25.09.2026).
      - name: Одобрить «Проверку PR» на новом коммите
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          # Прогон появляется не сразу. Нет PR у ветки — не появится вовсе.
          for _ in $(seq 12); do
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=pull_request&status=action_required" \
              --jq '.workflow_runs[].id')
            [ -n "$ids" ] && break
            sleep 5
          done
          if [ -z "$ids" ]; then
            echo "Прогона «Проверки PR» на $sha нет — у ветки нет открытого PR?" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for id in $ids; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"
          done
