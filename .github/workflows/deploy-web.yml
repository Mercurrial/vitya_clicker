name: Deploy web to GitHub Pages

# Сайт обновляется только выпуском версии — тегом vX.Y.Z. Раньше он
# пересобирался на каждое влитие в main, и каждый PR добавлял запись в
# Deployments: сотня выкладок, из которых версиями были единицы.
#
# Проверка PR живёт отдельно — в ci.yml, до влития и без выкладки.
#
# Окружение github-pages по умолчанию разрешает выкладку только из main. Для
# тегов в нём добавлено правило «v*» (Settings → Environments → github-pages);
# без него выкладка по тегу отклоняется, и сайт молча перестаёт обновляться.
on:
  push:
    tags: ['v*']
  # Ручной запуск — на случай, если выкладку надо повторить. В «Run workflow»
  # выбирать ТЕГ, а не main: иначе на сайт уедет невыпущенное.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write        # нужно, чтобы убрать артефакт прошлой попытки

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Версия прибита гвоздями. С "channel: stable" CI собирал игру
          # Flutter 3.47, а тесты у нас гоняются на 3.24 — выкладывалось то,
          # что никто не проверял.
          flutter-version: 3.24.3
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Выложить сломанную сборку дороже, чем подождать полминуты:
      # ссылка одна на всех.
      - run: flutter analyze
      - run: flutter test

      # Re-run загружает артефакт с тем же именем второй раз, и deploy-pages
      # отказывается выбирать из двух одинаковых. Именно так упал запуск #1.
      - name: Убрать артефакт прошлой попытки
        if: github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
          while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done

      # Адрес сайта — имя репозитория. Берётся из него же, а не пишется
      # руками: когда репозиторий переименовали из vitya_clicker, прибитый
      # адрес собрал бы сайт, который грузит скрипты по старому пути.
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
