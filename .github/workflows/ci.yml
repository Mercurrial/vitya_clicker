name: Проверка PR

# Анализ, тесты и снимки экрана — на каждый PR, до влития в main.
#
# Раньше тесты гонялись только внутри выкладки, то есть уже ПОСЛЕ влития:
# сломанное успевало попасть в main и на сайт. Теперь выкладка идёт по тегу
# (deploy-web.yml), а здесь — только проверка. Выкладок и записей в
# Deployments этот workflow не создаёт.
#
# Снимки сверяются здесь, потому что эталон снимков — именно эта платформа:
# ubuntu-latest с Flutter 3.24.3. Раньше их снимали на разных машинах, и не
# было ни одной, где проходили бы все: шрифты на Windows и на Linux рисуются
# по-разному. Переснимает их только goldens.yml, на этой же платформе.
#
# Замеры (тег perf) здесь не гоняются намеренно: на общих машинах GitHub
# они шумят. Их место — у владельца перед выпуском (docs/RELEASE.md).
on:
  pull_request:
    branches: [main]
  # Ручной запуск на ветке. Его же делает goldens.yml после своего коммита:
  # push от GITHUB_TOKEN проверку не запускает, и у коммита со снимками её
  # иначе не было бы вовсе.
  workflow_dispatch:

permissions:
  contents: read

# Новый push в тот же PR отменяет недоделанную проверку старого. Ручной
# запуск — в своей группе: отмена PR-прогоном оставила бы в PR серую
# «отменено» рядом с зелёной проверкой того же коммита.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Анализ и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Та же версия, что в выкладке и у разработчика. См. deploy-web.yml.
          flutter-version: 3.24.3
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  goldens:
    name: Снимки экрана
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Сменить версию — значит переснять все снимки: движок рисует иначе.
          flutter-version: 3.24.3
          channel: stable
          cache: true

      - run: flutter pub get
      # По умолчанию снимки пропускаются (dart_test.yaml), и явный --tags
      # этого не отменяет — нужен --run-skipped.
      - run: flutter test --tags golden --run-skipped

      # Без картинок красная проверка говорит только «не совпало». В
      # архиве на каждый упавший снимок четыре файла: эталон
      # (_masterImage), новый кадр (_testImage) и разница — отдельно
      # (_isolatedDiff) и поверх кадра (_maskedDiff).
      - name: Выложить разницу снимков
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: goldens-failures
          path: test/failures/
          if-no-files-found: ignore
          retention-days: 14
