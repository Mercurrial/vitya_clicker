<!-- @dsCard group="KARDASHEV App" viewport="1360x940" subtitle="Idle star-core game — three device frames (Generators, Upgrades, Core pressed)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KARDASHEV — UI Kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(circle at 50% -10%, #121722, #0A0D14 60%);
    font-family: var(--font-ui);
    min-height: 100vh;
    color: var(--text-hi);
  }
  .stage {
    display: flex;
    gap: 44px;
    justify-content: center;
    align-items: flex-start;
    padding: 56px 32px 72px;
    min-height: 100vh;
  }
  .col { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .label {
    font-size: var(--type-tier-size);
    font-weight: var(--type-tier-weight);
    letter-spacing: var(--type-tier-tracking);
    text-transform: uppercase;
    color: var(--text-mid);
  }
  .label b { color: var(--accent); font-weight: 600; }

  /* Device frame — iPhone 14 portrait */
  .frame {
    width: var(--frame-w);
    height: var(--frame-h);
    border-radius: 46px;
    overflow: hidden;
    position: relative;
    background: var(--void);
    box-shadow: 0 0 0 2px #1b2230, 0 0 0 5px #0c0f16, 0 30px 90px rgba(0,0,0,0.6);
  }

  /* ---- App layout ---- */
  .km-app {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
    color: var(--text-hi);
    background:
      radial-gradient(120% 60% at 50% 30%, rgba(52,226,214,0.06), transparent 60%),
      var(--void);
  }
  .km-header {
    height: 150px; flex: none;
    padding: 26px 0 8px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .km-tier { font-size: var(--type-tier-size); font-weight: var(--type-tier-weight);
    letter-spacing: var(--type-tier-tracking); text-transform: uppercase; color: var(--text-mid); }
  .km-chips { display: flex; gap: 12px; }

  .km-core-zone { height: 380px; flex: none; display: flex; align-items: center; justify-content: center; }
  .km-core-wrap { position: relative; width: 210px; height: 210px; }
  .km-burst-layer { position: absolute; inset: 0; pointer-events: none; }

  .km-ripple {
    position: absolute; left: 50%; top: 50%; width: 210px; height: 210px;
    border-radius: 50%; border: 2px solid var(--accent);
    transform: translate(-50%, -50%) scale(0);
    animation: km-ripple 600ms ease-out forwards;
  }
  .km-float {
    position: absolute; left: 50%; top: 40%;
    transform: translate(-50%, 0);
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: 18px; font-weight: 600; color: var(--accent);
    text-shadow: 0 0 14px var(--accent-glow); white-space: nowrap;
    animation: km-float 700ms ease-out forwards;
  }
  .km-float.km-static { animation: none; transform: translate(-50%, -48px); }
  .km-particle {
    position: absolute; left: 50%; top: 50%; width: 7px; height: 7px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent-glow);
    transform: translate(-50%, -50%);
    animation: km-particle 700ms ease-out forwards;
  }

  /* ---- Bottom sheet ---- */
  .km-sheet {
    flex: 1; min-height: 0;
    border-top-left-radius: var(--radius-sheet);
    border-top-right-radius: var(--radius-sheet);
    background: var(--glass-bg);
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
    border-top: 1px solid var(--glass-border);
    box-shadow: var(--shadow-sheet);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .km-sheet-tabs { padding: 14px 16px 10px; }
  .km-sheet-body { position: relative; flex: 1; min-height: 0; }
  .km-fade {
    position: absolute; top: 0; left: 0; right: 0; height: 22px; z-index: 2; pointer-events: none;
    background: linear-gradient(180deg, rgba(16,20,29,0.85), transparent);
  }
  .km-scroll { height: 100%; overflow-y: auto; padding: 10px 16px 22px; }
  .km-scroll::-webkit-scrollbar { width: 0; }
  .km-list { display: flex; flex-direction: column; gap: 8px; }
  .km-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: stretch; }
  .km-grid > * { display: flex; }
  .km-grid > * > * { flex: 1; }

  /* ---- Animations ---- */
  @keyframes km-ripple {
    from { transform: translate(-50%, -50%) scale(0); opacity: 0.6; }
    to   { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
  }
  @keyframes km-float {
    from { transform: translate(-50%, 0); opacity: 1; }
    to   { transform: translate(-50%, -48px); opacity: 0; }
  }
  @keyframes km-particle {
    from { transform: translate(-50%, -50%) translate(0,0) scale(1); opacity: 1; }
    to   { transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) scale(0.2); opacity: 0; }
  }
  @keyframes km-pop { 0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); } }
  .km-pop { animation: km-pop 220ms ease; }
  @media (prefers-reduced-motion: reduce) { .km-pop { animation: none; } }
</style>
</head>
<body>
  <div class="stage">
    <div class="col">
      <div class="label">A · Generators</div>
      <div class="frame"><div id="frameA"></div></div>
    </div>
    <div class="col">
      <div class="label">B · Upgrades</div>
      <div class="frame"><div id="frameB"></div></div>
    </div>
    <div class="col">
      <div class="label">C · Core — <b>PRESSED</b></div>
      <div class="frame"><div id="frameC"></div></div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="format.js"></script>
  <script type="text/babel" src="KardashevApp.jsx"></script>
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById("frameA")).render(<KardashevApp startTab="Generators" />);
    ReactDOM.createRoot(document.getElementById("frameB")).render(<KardashevApp startTab="Upgrades" />);
    ReactDOM.createRoot(document.getElementById("frameC")).render(<KardashevApp startTab="Generators" showcase={true} />);
  </script>
</body>
</html>
