<!-- @dsCard group="Colors" viewport="700x150" name="Text & Glass" subtitle="Three text levels; the blurred glass panel surface." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--void); font-family: var(--font-ui); }
  .wrap { display: flex; gap: var(--space-4); padding: var(--space-5); align-items: stretch; }
  .text { flex: 1.2; display: flex; flex-direction: column; gap: var(--space-2); justify-content: center; }
  .text div { font-size: 15px; font-weight: 500; }
  .glass { flex: 1; border-radius: var(--radius-card); border: 1px solid var(--glass-border);
           background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
           box-shadow: inset 0 1px 0 var(--glass-inset); display: flex; align-items: center; justify-content: center;
           color: var(--text-mid); font-size: 12px; position: relative; overflow: hidden; }
  .glass::before { content: ""; position: absolute; inset: 0; z-index: -1;
    background: radial-gradient(circle at 30% 30%, var(--accent-glow), transparent 60%); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="text">
      <div style="color: var(--text-hi)">text-hi · 0.92 — primary readout</div>
      <div style="color: var(--text-mid)">text-mid · 0.60 — labels & meta</div>
      <div style="color: var(--text-lo)">text-lo · 0.38 — disabled / locked</div>
    </div>
    <div class="glass">glass-bg · blur(14px)</div>
  </div>
</body>
</html>
