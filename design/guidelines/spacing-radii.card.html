<!-- @dsCard group="Spacing" viewport="700x180" name="Radii & card shadow" subtitle="sheet 28 · card 18 · button 14 · pill 999" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--void); font-family: var(--font-ui); padding: var(--space-6);
         display: flex; gap: var(--space-5); align-items: center; }
  .box { background: var(--surface-2); box-shadow: var(--shadow-card); border: 1px solid var(--glass-border);
         width: 96px; height: 96px; display: flex; align-items: flex-end; justify-content: center;
         padding-bottom: 10px; box-sizing: border-box; }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--text-mid); }
  .pill { width: 120px; height: 44px; border-radius: var(--radius-pill); }
</style>
</head>
<body>
  <div class="box" style="border-radius: var(--radius-sheet)"><span class="lbl">28</span></div>
  <div class="box" style="border-radius: var(--radius-card)"><span class="lbl">18</span></div>
  <div class="box" style="border-radius: var(--radius-button)"><span class="lbl">14</span></div>
  <div class="box pill"><span class="lbl">999</span></div>
</body>
</html>
