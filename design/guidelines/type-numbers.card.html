<!-- @dsCard group="Type" viewport="700x190" name="Hero counter & numbers" subtitle="IBM Plex Mono, tabular-nums. Scientific notation for the readout." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--void); font-family: var(--font-ui); padding: var(--space-5); }
  .hero { font-family: var(--font-mono); font-variant-numeric: tabular-nums;
          font-size: var(--type-hero-size); font-weight: var(--type-hero-weight);
          letter-spacing: var(--type-hero-tracking); color: var(--text-hi);
          text-shadow: 0 0 24px var(--accent-glow); }
  .hero sup { font-size: 0.5em; }
  .meta { display: flex; gap: var(--space-5); margin-top: var(--space-3); }
  .meta span { font-family: var(--font-mono); font-variant-numeric: tabular-nums;
               font-size: var(--type-stat-size); font-weight: var(--type-stat-weight); }
  .cy { color: var(--accent); }
  .mid { color: var(--text-mid); }
  .note { color: var(--text-lo); font-size: 11px; margin-top: var(--space-3); }
</style>
</head>
<body>
  <div class="hero">4.20 &times; 10<sup>23</sup> J</div>
  <div class="meta">
    <span class="cy">&#9650; 1.34e18 J/s</span>
    <span class="mid">&#9737; 8.00e15 J/tap</span>
  </div>
  <div class="note">Hero: m.mm &times; 10&#8319;  ·  compact: m.mme+n  ·  &lt;1000: 750</div>
</body>
</html>
