<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Dark neutrals — the ~60% base. Never pure black." -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--void); font-family: var(--font-ui); }
  .row { display: flex; gap: var(--space-3); padding: var(--space-5); }
  .sw { flex: 1; border-radius: var(--radius-card); height: 88px; border: 1px solid var(--glass-border);
        display: flex; flex-direction: column; justify-content: flex-end; padding: var(--space-3); box-sizing: border-box; }
  .name { font-size: 12px; font-weight: 600; color: var(--text-hi); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-mid); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--void)"><div class="name">void</div><div class="hex">#0A0D14</div></div>
    <div class="sw" style="background: var(--surface-1)"><div class="name">surface-1</div><div class="hex">#10141D</div></div>
    <div class="sw" style="background: var(--surface-2)"><div class="name">surface-2</div><div class="hex">#171C28</div></div>
    <div class="sw" style="background: var(--surface-3)"><div class="name">surface-3</div><div class="hex">#202637</div></div>
  </div>
</body>
</html>
