<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Витя гонит самогон в гараже. Idle-игра.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Витя гонит">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Витя гонит</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#14100C">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <style>
    /*
      Игра держится на зажиме пальца, а браузер считает долгое нажатие
      приглашением что-нибудь выделить или показать меню. Без этих правил
      зажим по гаражу подсвечивал полэкрана синим, а на телефоне вызывал
      «Скопировать / Найти».
    */
    html, body {
      margin: 0;
      background: #14100C;
      height: 100%;
      overflow: hidden;              /* нечего скролить: игра ровно в экран */
      overscroll-behavior: none;     /* и незачем тянуть страницу вниз */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;   /* Safari: меню по долгому нажатию */
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;    /* убирает задержку 300 мс на тап */
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
