# Снимки экрана и замеры в общий прогон `flutter test` не входят.
#
# Снимки сверяются с эталоном, снятым на одной платформе — ubuntu-latest с
# Flutter 3.24.3 в GitHub Actions. На Windows шрифты рисуются иначе, и
# локально снимки с текстом не совпадут никогда; это ожидаемо, а не поломка.
# Сверяет их отдельная работа «Снимки экрана» в ci.yml на каждом PR,
# переснимает — workflow «Переснять снимки» (goldens.yml). Локально
# переснятые снимки не коммитить: проверка PR на них упадёт.
#
# Прогнать всё равно можно:
#   flutter test --tags golden --run-skipped
# `--run-skipped` обязателен: skip ниже выключает их и для явного --tags.
tags:
  # Замеры по секундомеру: в общем прогоне врут, потому что машина занята
  # остальными тестами. Запускать отдельно:
  #   flutter test --tags perf --run-skipped
  perf:
    skip: "замеры: flutter test --tags perf --run-skipped"

  golden:
    skip: "снимки: сверяет CI, переснимает workflow «Переснять снимки» (goldens.yml)"
