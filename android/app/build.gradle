plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.mercurrial.vityagonit"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.mercurrial.vityagonit"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Игра раздаётся файлом, а не через Google Play, поэтому хватает
            // отладочного ключа: APK ставится сбоку и обновляется поверх, пока
            // ключ не меняется. Появится Play — заведём свой keystore, но
            // переустановка тогда потребует удалить старую сборку.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
